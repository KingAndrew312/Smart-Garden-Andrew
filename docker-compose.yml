# Smart Garden di VPS (47.254.170.208)
#   http://47.254.170.208        -> dashboard (Nginx -> app)
#   ws://47.254.170.208/mqtt     -> MQTT WebSocket untuk dashboard (Nginx -> Mosquitto)
#   mqtt://47.254.170.208:1883   -> MQTT untuk ESP32
# Jalankan: cp .env.example .env  (isi password & token)  lalu  docker compose up -d --build

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    # UI InfluxDB hanya bisa dibuka dari VPS sendiri (atau lewat SSH tunnel), tidak terbuka ke internet
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:?isi INFLUX_USERNAME di .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?isi INFLUX_PASSWORD di .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-smart-garden}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-garden}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?isi INFLUX_TOKEN di .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-smart-garden}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-garden}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_TOPIC: binus/garden/sensor/data
      # Dashboard memakai broker di server yang sama (lewat Nginx /mqtt)
      MQTT_WS_URL: /mqtt
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - mosquitto

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
